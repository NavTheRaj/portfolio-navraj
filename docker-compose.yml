services:
  portfolio-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "yarn install && yarn dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules

  portfolio-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
